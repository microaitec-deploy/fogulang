[package]
name = "fogu"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio       = { version = "1", features = ["full"] }
bytes       = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sled        = "0.34"
dotenvy     = "0.15"
uuid        = { version = "1", features = ["v4"] }
thiserror   = "1"
tracing     = "0.1.44"
tracing-subscriber = "0.3"