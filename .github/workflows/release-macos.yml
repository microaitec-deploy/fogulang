# macOS executables and embeddable runtime for a release.
#
# The other platforms are built by server/publish-all.sh on Linux; macOS needs
# Apple's SDK, so it is built here, on a GitHub macOS runner (Apple Silicon),
# for both architectures. Run it by hand (Actions → "Release macOS" → Run
# workflow, giving a tag such as v0.8.1) or push a tag; then download the
# artifact and copy its files into server/releases/<version>/:
#
#   gh run download <run id> -n fogu-macos -D server/releases/0.8.1
#
# Files: fogu-macos-arm64, fogu-macos-x64, libfogu_rt-macos-arm64.dylib,
# libfogu_rt-macos-x64.dylib (the names the download page lists).
name: Release macOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (e.g. v0.8.1)"
        required: true
        default: main
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Rust targets
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build (Apple Silicon)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked -p fogu-ffi --target aarch64-apple-darwin

      - name: Build (Intel)
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked -p fogu-ffi --target x86_64-apple-darwin

      - name: Collect
        run: |
          mkdir -p out
          cp target/aarch64-apple-darwin/release/fogu out/fogu-macos-arm64
          cp target/x86_64-apple-darwin/release/fogu out/fogu-macos-x64
          cp target/aarch64-apple-darwin/release/libfogu_rt.dylib out/libfogu_rt-macos-arm64.dylib
          cp target/x86_64-apple-darwin/release/libfogu_rt.dylib out/libfogu_rt-macos-x64.dylib
          file out/*
          ls -l out

      - name: Check (Apple Silicon)
        run: |
          ./out/fogu-macos-arm64 --version
          printf 'fn f(n) { return n * 2, nil }\nconst [v, e] = f(21)\nprint(v, e)\n' > check.fg
          ./out/fogu-macos-arm64 check.fg

      - name: Check (Intel, under Rosetta when the runner has it)
        continue-on-error: true
        run: |
          arch -x86_64 ./out/fogu-macos-x64 --version
          arch -x86_64 ./out/fogu-macos-x64 check.fg

      - uses: actions/upload-artifact@v4
        with:
          name: fogu-macos
          path: out/*
          if-no-files-found: error
