# The release files of every platform the download page lists, each built on a
# GitHub runner (macOS needs Apple's SDK, so it can only be built on a Mac).
#
#   - a tag v* builds everything and attaches the files to the GitHub release of
#     that tag (created if it does not exist);
#   - by hand (Actions → "Release" → Run workflow) it builds a tag or branch and
#     keeps the files as the run's artifacts; tick "publish" to attach them to
#     the GitHub release too.
#
# The site serves the same files from server/releases/<version>/:
#
#   gh run download <run id> -p 'fogu-*' -D /tmp/rel && cp /tmp/rel/*/* server/releases/0.8.1/
#
# The .deb packages, the sources archive and the VS Code extension are still
# made by server/publish-all.sh.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (e.g. v0.8.1)"
        required: true
        default: main
      publish:
        description: "Attach the files to the GitHub release of that tag"
        type: boolean
        default: false

permissions:
  contents: write

env:
  REF: ${{ github.event.inputs.ref || github.ref }}
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04 # glibc 2.35: runs on the distributions of the last years
            target: x86_64-unknown-linux-gnu
            exe: fogu
            lib: libfogu_rt.so
            out_exe: fogu
            out_lib: libfogu_rt-linux-x64.so
            run: native
          - name: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
            exe: fogu
            lib: libfogu_rt.so
            out_exe: fogu-linux-arm64
            out_lib: libfogu_rt-linux-arm64.so
            run: qemu-aarch64
          - name: linux-armv7
            os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            apt: gcc-arm-linux-gnueabihf
            exe: fogu
            lib: ""
            out_exe: fogu-linux-armv7
            out_lib: ""
            run: qemu-arm
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: fogu.exe
            lib: fogu_rt.dll
            out_exe: fogu.exe
            out_lib: fogu_rt-windows-x64.dll
            run: native
          - name: windows-x86
            os: windows-latest
            target: i686-pc-windows-msvc
            exe: fogu.exe
            lib: fogu_rt.dll
            out_exe: fogu-windows-x86.exe
            out_lib: fogu_rt-windows-x86.dll
            run: native
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: fogu
            lib: libfogu_rt.dylib
            out_exe: fogu-macos-arm64
            out_lib: libfogu_rt-macos-arm64.dylib
            run: native
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: fogu
            lib: libfogu_rt.dylib
            out_exe: fogu-macos-x64
            out_lib: libfogu_rt-macos-x64.dylib
            run: rosetta
          - name: wasm
            os: ubuntu-22.04
            target: wasm32-wasip1
            exe: fogu.wasm
            lib: ""
            out_exe: fogu.wasm
            out_lib: ""
            run: none
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Tools
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
          if [ -n "${{ matrix.apt }}" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q ${{ matrix.apt }} qemu-user
          fi
          if [ "${{ matrix.name }}" = linux-x64 ]; then
            # OpenSSL linked statically, as in the executables built by server/publish-all.sh
            sudo apt-get update -q && sudo apt-get install -y -q libssl-dev
            {
              echo X86_64_UNKNOWN_LINUX_GNU_OPENSSL_STATIC=1
              echo X86_64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu
              echo X86_64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR=/usr/include
            } >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.name }}" = macos-x64 ]; then
            echo MACOSX_DEPLOYMENT_TARGET=10.15 >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          if [ -n "${{ matrix.lib }}" ]; then
            cargo build --release --locked -p fogu-ffi --target ${{ matrix.target }}
          fi

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          d=target/${{ matrix.target }}/release
          cp "$d/${{ matrix.exe }}" "out/${{ matrix.out_exe }}"
          if [ -n "${{ matrix.lib }}" ]; then cp "$d/${{ matrix.lib }}" "out/${{ matrix.out_lib }}"; fi
          ls -l out

      - name: Check
        shell: bash
        run: |
          printf 'fn f(n) { return n * 2, nil }\nconst [v, e] = f(21)\nprint(v, e)\n' > check.fg
          exe="out/${{ matrix.out_exe }}"
          case "${{ matrix.run }}" in
            native) run="$exe" ;;
            qemu-aarch64) run="qemu-aarch64 -L /usr/aarch64-linux-gnu $exe" ;;
            qemu-arm) run="qemu-arm -L /usr/arm-linux-gnueabihf $exe" ;;
            rosetta) run="arch -x86_64 $exe" ;;
            none) echo "not run here (the site's playground runs it)"; exit 0 ;;
          esac
          $run --version
          got=$($run check.fg | tr -d '\r')
          echo "$got"
          if [ "$got" != "42 nil" ]; then echo "unexpected output"; exit 1; fi
          ver=$($run --version | tr -d '\r' | awk '{print $NF}')
          want=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          if [ "$ver" != "$want" ]; then echo "version $ver, Cargo.toml says $want"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: fogu-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.publish == 'true') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fogu-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Fogu ${TAG#v}" --notes "See CHANGELOG.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
