# The release files of every platform the download page lists, each built on a
# GitHub runner (macOS needs Apple's SDK, so it can only be built on a Mac).
#
#   - a tag v* builds everything and attaches the files to the GitHub release of
#     that tag (created if it does not exist);
#   - by hand (Actions → "Release" → Run workflow) it builds a tag or branch and
#     keeps the files as the run's artifacts; tick "publish" to attach them to
#     the GitHub release too.
#
# Besides the executables and the runtime libraries, a release has:
#
#   - fogu-linux-amd64 and fogu-linux-x86_64: the Linux x64 executable (`fogu`)
#     under the names other tools and scripts look for;
#   - fogu-amd64.deb, fogu-arm64.deb, fogu-armhf.deb: Debian/Ubuntu/Raspberry Pi
#     OS packages (/usr/bin/fogu);
#   - fogu-src.tar.gz: the sources (one folder, fogu-<version>/);
#   - fogu-vscode.vsix: the VS Code extension (editors/vscode);
#   - SHA256SUMS.
#
# The site serves the same files from server/releases/<version>/:
#
#   gh run download <run id> -p 'fogu-*' -D /tmp/rel && cp /tmp/rel/*/* server/releases/0.8.3/
#
# server/publish-all.sh is no longer needed to make them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (e.g. v0.8.3)"
        required: true
        default: main
      publish:
        description: "Attach the files to the GitHub release of that tag"
        type: boolean
        default: false

permissions:
  contents: write

env:
  REF: ${{ github.event.inputs.ref || github.ref }}
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            zig: true
            exe: fogu
            lib: libfogu_rt.so
            out_exe: fogu
            out_lib: libfogu_rt-linux-x64.so
            run: native
          - name: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            zig: true
            apt: gcc-aarch64-linux-gnu
            exe: fogu
            lib: libfogu_rt.so
            out_exe: fogu-linux-arm64
            out_lib: libfogu_rt-linux-arm64.so
            run: qemu-aarch64
          - name: linux-armv7
            os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            zig: true
            apt: gcc-arm-linux-gnueabihf
            exe: fogu
            lib: ""
            out_exe: fogu-linux-armv7
            out_lib: ""
            run: qemu-arm
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: fogu.exe
            lib: fogu_rt.dll
            out_exe: fogu.exe
            out_lib: fogu_rt-windows-x64.dll
            run: native
          - name: windows-x86
            os: windows-latest
            target: i686-pc-windows-msvc
            exe: fogu.exe
            lib: fogu_rt.dll
            out_exe: fogu-windows-x86.exe
            out_lib: fogu_rt-windows-x86.dll
            run: native
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: fogu
            lib: libfogu_rt.dylib
            out_exe: fogu-macos-arm64
            out_lib: libfogu_rt-macos-arm64.dylib
            run: native
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: fogu
            lib: libfogu_rt.dylib
            out_exe: fogu-macos-x64
            out_lib: libfogu_rt-macos-x64.dylib
            run: rosetta
          - name: wasm
            os: ubuntu-22.04
            target: wasm32-wasip1
            exe: fogu.wasm
            lib: ""
            out_exe: fogu.wasm
            out_lib: ""
            run: none
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Tools
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
          if [ -n "${{ matrix.apt }}" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q ${{ matrix.apt }} qemu-user
          fi
          if [ "${{ matrix.zig }}" = true ]; then
            # Linux: linked against glibc 2.17 with zig, OpenSSL compiled in, so the
            # executable runs on every distribution of the last ten years (built with
            # the runner's own toolchain it needed glibc 2.35, Ubuntu 22.04 or newer)
            pip install --quiet ziglang cargo-zigbuild
          fi
          if [ "${{ matrix.name }}" = macos-x64 ]; then
            echo MACOSX_DEPLOYMENT_TARGET=10.15 >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17 --features vendored-openssl
            if [ -n "${{ matrix.lib }}" ]; then
              cargo zigbuild --release --locked -p fogu-ffi --target ${{ matrix.target }}.2.17 --features fogu/vendored-openssl
            fi
          else
            cargo build --release --locked --target ${{ matrix.target }}
            if [ -n "${{ matrix.lib }}" ]; then
              cargo build --release --locked -p fogu-ffi --target ${{ matrix.target }}
            fi
          fi

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          d=target/${{ matrix.target }}/release
          cp "$d/${{ matrix.exe }}" "out/${{ matrix.out_exe }}"
          if [ -n "${{ matrix.lib }}" ]; then cp "$d/${{ matrix.lib }}" "out/${{ matrix.out_lib }}"; fi
          ls -l out
          if [ "${{ matrix.zig }}" = true ]; then
            # the newest glibc symbol must be 2.17 or older
            for f in out/*; do
              need=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
              echo "$f needs $need"
              [ "$(printf '%s\nGLIBC_2.17\n' "$need" | sort -V | tail -n 1)" = GLIBC_2.17 ] || { echo "needs a glibc newer than 2.17"; exit 1; }
            done
          fi

      - name: Check
        shell: bash
        run: |
          printf 'fn f(n) { return n * 2, nil }\nconst [v, e] = f(21)\nprint(v, e)\n' > check.fg
          exe="out/${{ matrix.out_exe }}"
          case "${{ matrix.run }}" in
            native) run="$exe" ;;
            qemu-aarch64) run="qemu-aarch64 -L /usr/aarch64-linux-gnu $exe" ;;
            qemu-arm) run="qemu-arm -L /usr/arm-linux-gnueabihf $exe" ;;
            rosetta) run="arch -x86_64 $exe" ;;
            none) echo "not run here (the site's playground runs it)"; exit 0 ;;
          esac
          $run --version
          got=$($run check.fg | tr -d '\r')
          echo "$got"
          if [ "$got" != "42 nil" ]; then echo "unexpected output"; exit 1; fi
          ver=$($run --version | tr -d '\r' | awk '{print $NF}')
          want=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          if [ "$ver" != "$want" ]; then echo "version $ver, Cargo.toml says $want"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: fogu-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # The files made from the Linux executables and from the sources: the Linux x64
  # executable under its other names, the Debian packages, the sources archive
  # and the VS Code extension.
  packages:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/download-artifact@v4
        with:
          pattern: fogu-linux-*
          path: linux
          merge-multiple: true

      - name: Version
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "no version in Cargo.toml"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p pkg
          ls -l linux

      - name: Linux x64 under its other names
        run: |
          [ -f linux/fogu ] || { echo "no Linux x64 executable (did linux-x64 fail?)"; exit 1; }
          cp linux/fogu pkg/fogu-linux-amd64
          cp linux/fogu pkg/fogu-linux-x86_64
          chmod +x pkg/fogu-linux-*

      - name: Debian packages
        env:
          MAINTAINER: ${{ vars.DEB_MAINTAINER || 'Edmilson Soares' }}
        run: |
          deb() { # deb <executable> <debian arch>
            exe="linux/$1"; arch=$2
            [ -f "$exe" ] || { echo "skip $arch: no $1"; return 0; }
            root="work/fogu_$arch"
            mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/share/doc/fogu"
            install -m 0755 "$exe" "$root/usr/bin/fogu"
            cp LICENSE "$root/usr/share/doc/fogu/copyright"
            size=$(du -k "$root/usr" | tail -n 1 | cut -f1)
            # OpenSSL is compiled in (vendored): only the C library is needed
            depends="libc6 (>= 2.17)"
            if readelf -d "$exe" 2>/dev/null | grep -q 'libssl.so.3'; then
              depends="$depends, libssl3 | libssl3t64"
            fi
            {
              echo "Package: fogu"
              echo "Version: $VERSION"
              echo "Architecture: $arch"
              echo "Maintainer: $MAINTAINER"
              echo "Installed-Size: $size"
              echo "Depends: $depends"
              echo "Section: devel"
              echo "Priority: optional"
              echo "Homepage: https://fogulang.microaitec.com"
              echo "Description: Fogu programming language and runtime"
              echo " One language, from automation to devices: configuration, automation,"
              echo " integrations, infrastructure, applications and microcontrollers, in one"
              echo " executable with a JIT, cooperative tasks, workers and a standard library."
            } > "$root/DEBIAN/control"
            dpkg-deb --root-owner-group -Zxz --build "$root" "pkg/fogu-$arch.deb"
            dpkg-deb --info "pkg/fogu-$arch.deb" | sed -n '/Package/,/Depends/p'
          }
          deb fogu amd64
          deb fogu-linux-arm64 arm64
          deb fogu-linux-armv7 armhf
          # the amd64 package installs and runs
          sudo dpkg -i pkg/fogu-amd64.deb
          printf 'print(6 * 7)\n' > check.fg
          [ "$(/usr/bin/fogu check.fg)" = 42 ] || { echo "the installed package does not run"; exit 1; }
          sudo dpkg -r fogu

      - name: Sources archive
        run: |
          # what git tracks, in one folder fogu-<version>/
          git archive --format=tar.gz --prefix="fogu-$VERSION/" -o "pkg/fogu-src.tar.gz" HEAD
          tar -tzf pkg/fogu-src.tar.gz | head -n 5
          tar -tzf pkg/fogu-src.tar.gz | grep -q "^fogu-$VERSION/Cargo.toml$"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: VS Code extension
        working-directory: editors/vscode
        run: |
          # the extension carries the release's version
          sed -i "s/\"version\": \"[0-9][^\"]*\"/\"version\": \"$VERSION\"/" package.json
          bun install --frozen-lockfile
          bun run typecheck
          bun run package
          cp fogu-vscode.vsix ../../pkg/fogu-vscode.vsix

      - name: List
        run: ls -l pkg

      - uses: actions/upload-artifact@v4
        with:
          name: fogu-packages
          path: pkg/*
          if-no-files-found: error

  publish:
    needs: [build, packages]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.publish == 'true') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fogu-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Fogu ${TAG#v}" --notes "See CHANGELOG.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
