# The prebuilt hosts of the desktop library (libs/desktop, a copy of
# ../libs/desktop made by scripts/sync-desktop-lib.sh) that cannot be built on
# the maintainer's machine: macOS (a macOS executable can only be built on a
# Mac) and Linux x64 (it needs the WebKitGTK development packages). They let
# `fogu desktop build` and `fogu desktop dev` work without Rust; they are
# built here and downloaded from the run as artifacts:
#
#   gh workflow run desktop-hosts.yml
#   gh run download <run id> -D hosts    # fogu-desktop-macos-arm64/, -macos-x64/, -linux-x64/
#
# Each artifact holds the generic host (fogu-desktop) and its SHA256SUMS.
# server/publish-libs.sh packs them into the library (hosts/<platform>/) when
# they are in libs/desktop/runtime/target/<triple>/release/ (Linux x64:
# libs/desktop/runtime/target/release/).
name: desktop-hosts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          # (the oldest supported Ubuntu: the host then runs on newer systems too)
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      # the library builds against ../../../lang (the layout of the project:
      # lang/ next to libs/), so the repository is checked out as lang/
      - uses: actions/checkout@v4
        with:
          path: lang

      - name: Layout
        run: |
          mkdir -p libs
          cp -R lang/libs/desktop libs/desktop
          grep -m1 '"version"' libs/desktop/fogu.json

      - name: Tools
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
          # (the oldest macOS the Fogu executables run on)
          if [ "${{ matrix.name }}" = macos-x64 ]; then
            echo MACOSX_DEPLOYMENT_TARGET=10.15 >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.name }}" = linux-x64 ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev librsvg2-dev libssl-dev build-essential pkg-config
          fi

      - name: Build the generic host
        working-directory: libs/desktop/runtime
        env:
          FOGU_DESKTOP_GENERIC: "1"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Collect
        run: |
          mkdir -p out
          cp libs/desktop/runtime/target/${{ matrix.target }}/release/fogu-desktop out/fogu-desktop
          file out/fogu-desktop
          ls -l out
          if [ "$RUNNER_OS" = macOS ]; then
            codesign -dv out/fogu-desktop 2>&1 | head -n 8 || true
            (cd out && shasum -a 256 fogu-desktop > SHA256SUMS && cat SHA256SUMS)
          else
            # the newest glibc symbol the host needs
            objdump -T out/fogu-desktop | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
            (cd out && sha256sum fogu-desktop > SHA256SUMS && cat SHA256SUMS)
          fi

      # Does an app made with this host work on this system? libs/desktop/tests/smoke
      # is built with the fresh host and no Rust, then started: its page calls a
      # command, waits for the event the command emits, reports to a file and
      # closes the app. The report on disk is the proof. Informative (a runner
      # without a usable window session must not fail the build of the host);
      # the result is in the job summary and in the artifact.
      - name: Smoke test (a window, a command, an event)
        id: smoke
        continue-on-error: true
        run: |
          flag=""
          runner=""
          case "${{ matrix.name }}" in
            macos-x64)
              # the Intel host on an Apple Silicon runner
              softwareupdate --install-rosetta --agree-to-license || true
              flag="--target x86_64-apple-darwin" ;;
            linux-x64)
              sudo apt-get install -y -q xvfb
              runner="xvfb-run -a" ;;
          esac
          (cd lang && cargo build --release --locked)
          FOGU="$PWD/lang/target/release/fogu"
          "$FOGU" --version
          mkdir -p hosts/${{ matrix.name }} smoke
          cp out/fogu-desktop hosts/${{ matrix.name }}/fogu-desktop
          cd libs/desktop/tests/smoke
          FOGU_BIN="$FOGU" FOGU_DESKTOP_HOSTS="$GITHUB_WORKSPACE/hosts" "$FOGU" ../../build.fg . $flag | grep -v '^  + '
          if [ "$RUNNER_OS" = macOS ]; then
            exe=$(find dist -path '*.app/Contents/MacOS/*' -type f | head -n 1)
          else
            exe=dist/smoke
          fi
          [ -n "$exe" ] && [ -f "$exe" ] || { echo "no executable in dist/"; find dist -maxdepth 4; exit 1; }
          file "$exe"
          export FOGU_SMOKE_OUT="$GITHUB_WORKSPACE/smoke/report.json"
          $runner "$exe" > "$GITHUB_WORKSPACE/smoke/app.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            [ -f "$FOGU_SMOKE_OUT" ] && break
            if [ "$i" = 5 ] && [ "$RUNNER_OS" = macOS ]; then
              screencapture -x "$GITHUB_WORKSPACE/smoke/window.png" || true
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ ! -f "$FOGU_SMOKE_OUT" ]; then
            echo "no report after 60 s"
            cat "$GITHUB_WORKSPACE/smoke/app.log"
            exit 1
          fi
          cat "$FOGU_SMOKE_OUT"; echo
          grep -q '"n":42' "$FOGU_SMOKE_OUT" && grep -q 'hello from Fogu' "$FOGU_SMOKE_OUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo "- host: $(cat out/SHA256SUMS 2>/dev/null)"
            echo "- smoke test: ${{ steps.smoke.outcome }}"
            if [ -f smoke/report.json ]; then echo '```'; cat smoke/report.json; echo; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: smoke/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: fogu-desktop-${{ matrix.name }}
          path: out/
          if-no-files-found: error
