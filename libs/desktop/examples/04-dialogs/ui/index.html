<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Editor</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
      nav { padding: 8px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid #ddd; }
      textarea { flex: 1; border: 0; padding: 12px; font: 13px ui-monospace, monospace; resize: none; }
      #name { margin-left: auto; color: #666; }
    </style>
  </head>
  <body>
    <nav>
      <button id="open">Open…</button>
      <button id="save">Save</button>
      <button id="saveAs">Save as…</button>
      <button id="new">New</button>
      <button id="about">About</button>
      <span id="name">untitled</span>
    </nav>
    <textarea id="text" spellcheck="false"></textarea>
    <script>
      const $ = (id) => document.getElementById(id);
      let file = { path: null, name: "untitled.txt" };
      let dirty = false;

      function show(f, text) {
        file = f;
        if (text !== undefined) {
          $("text").value = text;
        }
        dirty = false;
        $("name").textContent = f.path || "untitled";
      }

      // returns false when the user wants to keep the current text
      async function canDiscard() {
        return !dirty || (await fogu.call("confirm.discard"));
      }

      $("text").oninput = () => {
        dirty = true;
        $("name").textContent = (file.path || "untitled") + " •";
      };
      $("open").onclick = async () => {
        if (!(await canDiscard())) return;
        const f = await fogu.call("file.open"); // null: the dialog was cancelled
        if (f) show(f, f.text);
      };
      const save = async (saveAs) => {
        const f = await fogu.call("file.save", { ...file, text: $("text").value, saveAs });
        if (f) show(f);
      };
      $("save").onclick = () => save(false);
      $("saveAs").onclick = () => save(true);
      $("new").onclick = async () => (await canDiscard()) && show({ path: null, name: "untitled.txt" }, "");
      $("about").onclick = () => fogu.call("about");
    </script>
  </body>
</html>
