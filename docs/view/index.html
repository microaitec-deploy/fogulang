      (function () {
        let t = null;
        try { t = localStorage.getItem('fogu-theme'); } catch (e) {}
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
