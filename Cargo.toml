[package]
name = "fogu"
version = "0.8.0"
edition = "2024"
description = "Reference implementation of the Fogu language: interpreter, Cranelift JIT, REPL and package manager"
authors = ["Edmilson Soares"]
license = "MIT"
readme = "README.md"
keywords = ["fogu", "language", "interpreter", "jit", "scripting"]
categories = ["compilers", "command-line-utilities"]
exclude = ["examples/**/*.exe", "dist/"]

[lib]
name = "fogu"
path = "src/lib.rs"

[[bin]]
name = "fogu"
path = "src/main.rs"

[dependencies]
pprof = { version = "0.14", optional = true }
libc = "0.2"
fogu-core = { path = "crates/fogu-core" }
fogu-std = { path = "crates/fogu-std", default-features = false }
fogu-pkg = { path = "crates/fogu-pkg" }
base64 = "0.22"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
dotenvy = "0.15.7"

# a faster allocator for the many small objects of Fogu programs (not on Windows:
# mimalloc's C code needs newer mingw headers than cross toolchains ship)
[target.'cfg(all(not(windows), not(target_family = "wasm")))'.dependencies]
# no_thp: the allocator does not ask for transparent huge pages (where the system leaves them
# opt-in they cost megabytes of resident memory per process and no measurable speed)
mimalloc = { version = "0.1", default-features = false, features = ["no_thp"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustyline = "14"

# standalone executables as Windows services (toolkit/service.rs)
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[features]
# Standard library areas (crates/fogu-std/src/native/<area>); `base` and `io` are always built.
# `cargo build --release --no-default-features --features network` builds a small binary.
default = ["network", "database", "messaging", "ops", "ai", "media", "rpc"]
network = ["fogu-std/network"]
database = ["fogu-std/database"]
messaging = ["fogu-std/messaging"]
ops = ["fogu-std/ops"]
ai = ["fogu-std/ai"]
media = ["fogu-std/media"]
rpc = ["fogu-std/rpc"]
vendored-openssl = ["fogu-std/vendored-openssl"]
# `cargo build --profile profiling --features pprof`, then `FOGU_PPROF=1 fogu …`:
# an in-process sampling profiler (no root needed) prints the hottest functions at exit
pprof = ["dep:pprof"]
# `FOGU_T0=<CLOCK_MONOTONIC in ns> fogu …` prints when each phase of the start is reached
startup-trace = ["fogu-core/startup-trace"]

# debug builds: line tables only (backtraces keep file:line, linking is much faster)
[profile.dev]
debug = "line-tables-only"

# dependencies are optimized in debug builds too (crypto, compression, parsers)
[profile.dev.package."*"]
opt-level = 2

# `cargo build --release`: no symbols, thin LTO (a quick build: tests and development).
# What is published is built with whole-program LTO in one codegen unit, which drops
# the code nothing reaches (about 20% off the executable, same speed):
# `server/publish-all.sh` sets CARGO_PROFILE_RELEASE_LTO=fat and
# CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 (as `--profile dist` does). It needs ~6 GB of
# memory for one executable, so never two such builds at once.
[profile.release]
strip = true
lto = "thin"

# Size: the dependencies that are not on a hot path (cloud SDKs, database
# drivers, codecs, parsers of formats…) are compiled for size, which takes
# another 12% off the executable. What the benchmarks and servers spend
# their time in keeps full speed: the workspace crates (interpreter, natives),
# the JIT, the allocator, hashing, JSON and the network stack.
[profile.release.package."*"]
opt-level = "s"
[profile.release.package.cranelift-codegen]
opt-level = 3
[profile.release.package.cranelift-frontend]
opt-level = 3
[profile.release.package.cranelift-jit]
opt-level = 3
[profile.release.package.cranelift-module]
opt-level = 3
[profile.release.package.cranelift-entity]
opt-level = 3
[profile.release.package.cranelift-bforest]
opt-level = 3
[profile.release.package.cranelift-bitset]
opt-level = 3
[profile.release.package.cranelift-control]
opt-level = 3
[profile.release.package.cranelift-assembler-x64]
opt-level = 3
[profile.release.package.cranelift-native]
opt-level = 3
[profile.release.package.regalloc2]
opt-level = 3
[profile.release.package.mimalloc]
opt-level = 3
[profile.release.package.libmimalloc-sys]
opt-level = 3
[profile.release.package.hashbrown]
opt-level = 3
[profile.release.package.ahash]
opt-level = 3
[profile.release.package.rustc-hash]
opt-level = 3
[profile.release.package.foldhash]
opt-level = 3
[profile.release.package.corosensei]
opt-level = 3
[profile.release.package.smallvec]
opt-level = 3
[profile.release.package.serde]
opt-level = 3
[profile.release.package.serde_json]
opt-level = 3
[profile.release.package.memchr]
opt-level = 3
[profile.release.package.itoa]
opt-level = 3
[profile.release.package.ryu]
opt-level = 3
[profile.release.package.indexmap]
opt-level = 3
[profile.release.package.bumpalo]
opt-level = 3
[profile.release.package.tokio]
opt-level = 3
[profile.release.package.mio]
opt-level = 3
[profile.release.package.bytes]
opt-level = 3
[profile.release.package.hyper]
opt-level = 3
[profile.release.package.hyper-util]
opt-level = 3
[profile.release.package.h2]
opt-level = 3
[profile.release.package.http]
opt-level = 3
[profile.release.package.httparse]
opt-level = 3
[profile.release.package.http-body]
opt-level = 3
[profile.release.package.tungstenite]
opt-level = 3
[profile.release.package.tokio-tungstenite]
opt-level = 3
[profile.release.package.tokio-util]
opt-level = 3
[profile.release.package.socket2]
opt-level = 3
[profile.release.package.futures-util]
opt-level = 3
[profile.release.package.futures-core]
opt-level = 3
[profile.release.package.parking_lot]
opt-level = 3
[profile.release.package.parking_lot_core]
opt-level = 3
[profile.release.package.crossbeam-utils]
opt-level = 3
[profile.release.package.crossbeam-deque]
opt-level = 3
[profile.release.package.crossbeam-epoch]
opt-level = 3
[profile.release.package.regex]
opt-level = 3
[profile.release.package.regex-automata]
opt-level = 3
[profile.release.package.aho-corasick]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.base64]
opt-level = 3
[profile.release.package.simdutf8]
opt-level = 3
[profile.release.package.rustls]
opt-level = 3
[profile.release.package.ring]
opt-level = 3

# `cargo build --profile dist`: the smallest binary (what is published); slow to build
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# `cargo build --profile profiling`: release code with symbols, for perf / flamegraphs
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

# ffi/: the C API (libfogu_rt .so/.dll/.dylib): cargo build --release -p fogu-ffi
# fogu/: the standalone FoguMQ broker crate, not part of this build
[workspace]
members = [".", "ffi", "crates/*"]
# `cargo build` / `cargo test` at the root cover the CLI and the language crates
default-members = [".", "crates/fogu-core", "crates/fogu-std", "crates/fogu-pkg"]
exclude = ["fogu"]

